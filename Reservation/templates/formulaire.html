<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESERVATIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="p-6">

        <form method="post" class="space-y-4 ">

            <!-- Date de réservation -->
            <div class="flex flex-col gap-2">
                <label class="font-semibold"> Date et heure de réservation </label>form.date_reservation</div>
            <!-- Nombre de personnes -->
            <div class="flex flex-col gap-2">
                <label class="font-semibold"> Nombre de personnes </label> form.nombre_places </div>
            <!-- Statut -->
            <div class="flex flex-col gap-2">
                <label class="font-semibold"> Statut de réservation </label> form.statut </div>

            <button type="submit" class="btn btn-primary w-full">
        Enregistrer la réservation
    </button>

            <a href="{% url 'liste_reservations' %}" class="btn btn-outline w-full">
        Annuler
    </a>

        </form>


    </div>

</body>

</html>
