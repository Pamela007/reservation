<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESERVATIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="w-full bg-base-200">
        <div class="mb-4">
            <a href="" class="btn btn-primary w-full">Ajouter une réservation</a>
        </div>
        <div class="space-y-4 w-full">
            <div class="p-4 bg-base-100 rounded-lg w-full flex justify-between items-center">
                <div class="space-y-2">
                    <p class="font-bold text-lg">recommandation</p>
                    <p class="badge badge-soft badge-primary">reservation.time </p>
                    <div class="flex gap-2">
                        <p class="badge badge-soft badge-primary"> reservation.number_of_people</p>
                        <p class="badge badge-soft badge-secondary">reservation.status</p>
                    </div>
                </div>
                <div class="space-x-2">
                    <a href="{% url 'modifier_reservation' reservation.id %}" class="btn btn-outline btn-sm">Modifier</a>
                    <a href="{% url 'confirmer_suppression' reservation.id %}" class="btn btn-error btn-sm">Supprimer</a>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
